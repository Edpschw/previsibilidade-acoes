# TEMPORÁRIO (sai antes do merge): gera o histórico diário da aba Simular com dados reais, só
# neste branch, e commita no próprio branch. Sem Postgres, sem aviso, sem publicar o site.
name: Histórico (teste do branch)

on:
  push:
    branches: [claude/lucid-lamport-hala6y]
    paths: [scripts/historico.py, .github/workflows/historico-teste.yml]

permissions:
  contents: write

concurrency: historico-teste

jobs:
  gerar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache das fontes
        uses: actions/cache@v4
        with:
          path: scripts/sources
          key: fontes-${{ github.run_id }}
          restore-keys: fontes-

      - name: Histórico diário
        run: python3 scripts/historico.py

      - name: Commitar no branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/historico
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Histórico diário gerado no branch (teste)"
          git push
