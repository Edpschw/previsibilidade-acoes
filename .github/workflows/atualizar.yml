# Atualiza a base todo dia útil depois do fechamento da B3 e publica no GitHub Pages.
# Ordem: processa → histórico da aba Simular → resumo semanal → páginas e sitemap → testa → audita com trava
# → resume mudanças → commita (o Pages publica o commit)
# → carrega a mesma base no Postgres (só se o segredo DATABASE_URL existir)
# → manda a edição nova do resumo semanal pelo Buttondown (só se o segredo BUTTONDOWN_API_KEY existir).
# Se a trava ou os testes falharem, nada é commitado e um issue avisa.
name: Atualizar base

on:
  schedule:
    # minuto "quebrado": nos horários cheios (:00, :30) o GitHub atrasa ou descarta agendamentos
    - cron: "17 23 * * 1-5"   # 20h17 em Brasília
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency: atualizar-base

jobs:
  atualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      DATABASE_URL: ${{ secrets.DATABASE_URL }}           # base de produção (opcional)
      BUTTONDOWN_API_KEY: ${{ secrets.BUTTONDOWN_API_KEY }}  # envio do resumo semanal por e-mail (opcional)
      DATABASE_URL_TESTE: postgresql://postgres:teste@localhost:5432/postgres
    # Postgres descartável para os testes da base (tests/test_base.py)
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependências
        run: pip install -r requirements.txt

      # ZIPs da CVM, pregões da B3, fichas e PTAX (~400 MB). Só o que falta ou venceu é baixado de novo.
      - name: Cache das fontes
        uses: actions/cache@v4
        with:
          path: scripts/sources
          key: fontes-${{ github.run_id }}
          restore-keys: fontes-

      - name: Processar
        run: python3 scripts/processar.py

      # Histórico diário da aba Simular (cotações, eventos, proventos, CDI, IPCA). Se falhar, a base
      # sai do mesmo jeito, com o histórico da véspera, e um issue avisa.
      - name: Histórico diário (aba Simular)
        id: historico
        continue-on-error: true
        run: python3 scripts/historico.py

      # Resumo semanal em inglês (semana/ e semana/feed.xml): a edição da sexta sai uma vez, na primeira
      # execução com o pregão de sexta na base (ou de sábado até terça); nos outros dias o script só redesenha
      # as páginas. Antes das páginas indexáveis, que põem as edições no sitemap.
      - name: Resumo semanal
        run: python3 scripts/resumo_semanal.py

      - name: Páginas indexáveis e sitemap
        run: python3 scripts/gerar_paginas.py

      - name: Testes
        run: python3 -m unittest discover -s tests -v

      - name: Auditoria com trava de qualidade
        run: python3 scripts/auditar.py --externo --trava

      - name: Resumo de mudanças
        run: python3 scripts/mudancas.py

      - name: Commitar e publicar
        id: publicar
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/empresas.js data/agenda.js data/historico index.html auditoria.md auditoria.json auditoria_resumo.json acao semana sitemap.xml robots.txt
          if git diff --cached --quiet; then echo "sem mudanças"; exit 0; fi
          git commit -m "Atualiza base ($(date -u +%F))"
          git push

      - name: Avisar mudanças relevantes
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! head -1 mudancas.md | grep -q "^Nada relevante"; then
            gh issue create --title "Real Terms: $(head -1 mudancas.md) ($(date -u +%d/%m/%Y))" --body-file mudancas.md
          fi

      - name: Avisar falha no histórico
        if: steps.historico.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Real Terms: histórico da aba Simular falhou ($(date -u +%d/%m/%Y))" \
            --body "A base foi publicada normalmente; o histórico diário da aba Simular ficou o da execução anterior. Detalhes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Carga no Postgres, conferida campo a campo com o JSON; se divergir, nada é gravado.
      - name: Carregar base (Postgres)
        id: base
        if: env.DATABASE_URL != ''
        run: python3 scripts/carregar_base.py

      - name: Avisar falha na base Postgres
        if: failure() && steps.base.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Real Terms: carga no Postgres falhou ($(date -u +%d/%m/%Y))" \
            --body "O site foi publicado normalmente; a carga no Postgres foi desfeita e nada foi gravado nela. Detalhes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      # Resumo semanal por e-mail: cria a edição nova no Buttondown (rascunho ou envio, conforme
      # ENVIO_AUTOMATICO em scripts/resumo_semanal.py), uma vez só, e commita o registro
      # (semana/<sexta>/envio.json). Só roda com o segredo BUTTONDOWN_API_KEY. Depois da publicação,
      # para os links do e-mail já funcionarem, e mesmo se a carga no Postgres falhar; se o envio
      # falhar, o site já está no ar e um issue avisa.
      - name: Resumo semanal por e-mail (Buttondown)
        id: newsletter
        if: ${{ !cancelled() && steps.publicar.outcome == 'success' && env.BUTTONDOWN_API_KEY != '' }}
        continue-on-error: true
        run: |
          python3 scripts/resumo_semanal.py --enviar
          git add semana
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Registra envio do resumo semanal ($(date -u +%F))"
          git pull --rebase -q
          git push

      - name: Avisar rascunho do resumo no Buttondown
        if: ${{ !cancelled() && steps.newsletter.outputs.resultado == 'rascunho' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Real Terms: resumo semanal pronto no Buttondown ($(date -u +%d/%m/%Y))" \
            --body "A edição nova entrou como rascunho no Buttondown. Confira a aparência e mande pelo próprio Buttondown. Quando estiver tudo certo, ENVIO_AUTOMATICO = True em scripts/resumo_semanal.py passa a mandar sozinho."

      - name: Avisar falha no envio do resumo
        if: ${{ !cancelled() && steps.newsletter.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Real Terms: envio do resumo semanal falhou ($(date -u +%d/%m/%Y))" \
            --body "O site e a edição foram publicados normalmente; o e-mail não saiu. Detalhes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"

      - name: Avisar falha
        if: failure() && steps.base.outcome != 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create --title "Real Terms: atualização falhou ($(date -u +%d/%m/%Y))" \
            --body "A base não foi publicada. Detalhes: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
